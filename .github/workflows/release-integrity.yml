name: Release integrity

on:
  push:
  pull_request:

jobs:
  verify-production-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production tree
        run: .github/scripts/build-plugin.sh

      - name: Verify release identity and contents
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN=build/netgiro-payment-gateway-for-woocommerce

          grep -q '^ \* Version: 5.1.2$' "$PLUGIN/index.php"
          grep -q "define( 'NETGIRO_PLUGIN_VERSION', '5.1.2' );" "$PLUGIN/index.php"
          grep -q "'ClientInfo'.*NETGIRO_PLUGIN_VERSION" "$PLUGIN/includes/class-netgiro-payment-form.php"
          grep -q '^Stable tag: 5.1.2$' "$PLUGIN/readme.txt"
          grep -q '^ \* License:     GPLv3 or later$' "$PLUGIN/index.php"
          grep -q '^License: GPLv3 or later$' "$PLUGIN/readme.txt"
          grep -q 'Version 3, 29 June 2007' "$PLUGIN/LICENSE"

          test "$(find "$PLUGIN" -type f | wc -l)" -eq 15
          ! find "$PLUGIN" -type f | grep -Eq '(^|/)(trunk|branches|tags|tests?|vendor|tools|docs|\.git|\.github)(/|$)|\.zip$'
          ! grep -RInE '@version (5\.0\.0|5\.1\.0|5\.1\.1)' "$PLUGIN" --include='*.php'

      - name: Verify translation catalogues
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext

          .github/scripts/make-pot.sh
          git diff --exit-code -- languages/netgiro-payment-gateway-for-woocommerce.pot
          msgfmt --check languages/netgiro-payment-gateway-for-woocommerce-is.po -o /tmp/netgiro-is.mo
          test "$(msgunfmt languages/netgiro-payment-gateway-for-woocommerce-is.mo | grep -c '^msgid ')" -gt 1

      - name: PHP syntax
        run: find build/netgiro-payment-gateway-for-woocommerce -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Package artifact
        run: cd build && zip -qr netgiro-payment-gateway-for-woocommerce-5.1.2.zip netgiro-payment-gateway-for-woocommerce

      - uses: actions/upload-artifact@v4
        with:
          name: netgiro-payment-gateway-for-woocommerce-5.1.2
          path: build/netgiro-payment-gateway-for-woocommerce-5.1.2.zip